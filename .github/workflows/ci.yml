name: ORBIT 2.0 CI

on:
  push:
    branches:
      - main
      - "rebuild/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: orbit-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-contract:
    name: Backend compile and PostgreSQL integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: orbit_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: orbit_ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d orbit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      SECRET_KEY: orbit-ci-test-secret-not-for-production
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: orbit_test
      DB_USER: postgres
      DB_PASSWORD: orbit_ci_test_password
      DB_CONNECT_TIMEOUT: "5"
      ORBIT_RUN_POSTGRES_INTEGRATION: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Verify installed Python dependency constraints
        run: python -m pip check
      - name: Compile Python source
        run: python -m compileall -q backend
      - name: Run unit, contract and real PostgreSQL integration tests
        working-directory: backend
        run: python -m unittest discover -s tests -v

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Test browser-demo API
        working-directory: frontend
        run: npm test
      - name: Build production bundle
        working-directory: frontend
        run: npm run build
