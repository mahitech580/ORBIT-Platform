name: Publish ORBIT GitHub Pages Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build ORBIT frontend for the live API
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Test the browser demo API
        working-directory: frontend
        run: npm test
      - name: Build with GitHub Pages paths and demo mode
        working-directory: frontend
        env:
          GITHUB_PAGES: "true"
          VITE_DEMO_MODE: "false"
          VITE_API_URL: "https://orbit-platform-api-mahitech580.onrender.com/api"
          VITE_HEALTH_URL: "https://orbit-platform-api-mahitech580.onrender.com/health"
        run: npm run build
      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    name: Deploy static demo
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
