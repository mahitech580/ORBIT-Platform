name: Backend validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Python unit and PostgreSQL integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: orbit_ci_password
          POSTGRES_DB: orbit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d orbit_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      SECRET_KEY: ci-only-not-a-production-secret
      ENABLE_DEMO_AUTH: "false"
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: orbit_test
      DB_USER: postgres
      DB_PASSWORD: orbit_ci_password
      DB_CONNECT_TIMEOUT: "5"
      ORBIT_RUN_POSTGRES_INTEGRATION: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile Python modules
        working-directory: backend
        run: python -m compileall -q .
      - name: Run backend unit and PostgreSQL integration tests
        working-directory: backend
        run: python -m unittest discover -s tests -v
