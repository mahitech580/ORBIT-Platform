services:
  - type: web
    name: orbit-platform-api-mahitech580
    runtime: python
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python backend/init_db.py && gunicorn --chdir backend --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 60 app:app
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENABLE_DEMO_AUTH
        value: "false"
      - key: DB_CONNECT_TIMEOUT
        value: "5"
      - key: CORS_ORIGINS
        value: https://mahitech580.github.io
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: orbit-platform-db-mahitech580
          property: connectionString

databases:
  - name: orbit-platform-db-mahitech580
    databaseName: orbit_platform_db_mahitech580
    user: orbit_platform_db_mahitech580_user
    region: singapore
    plan: free
    postgresMajorVersion: "18"
    ipAllowList: []
